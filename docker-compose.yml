# PrivaSearch — privacy-first AI search (SearXNG + Ollama + RAG API + React UI)
#
# Networking model (privacy-critical):
#   - Every service sits on the internal bridge network `privanet`.
#   - ONLY the frontend publishes a host port. SearXNG, Ollama and the API
#     have NO `ports:` mapping, so they are unreachable from outside Docker.
#   - The browser talks only to the frontend; nginx reverse-proxies /api/* to
#     the API container over the internal network.
name: privasearch

services:
  # ── Metasearch backend ────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: privasearch-searxng
    volumes:
      # settings.yml carries all the privacy hardening (see comments in it).
      - ./searxng:/etc/searxng:rw
    environment:
      # Base URL is only used for absolute links; kept local.
      - SEARXNG_BASE_URL=http://localhost:${FRONTEND_PORT:-8080}/
      - INSTANCE_NAME=PrivaSearch
    networks: [privanet]
    # NO ports published — reachable only by the API container.
    restart: unless-stopped

  # ── Local LLM ─────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: privasearch-ollama
    volumes:
      # Model weights persist here so you pull once and stay offline after.
      - ollama-models:/root/.ollama
    networks: [privanet]
    # NO ports published — the LLM never listens on your host network.
    restart: unless-stopped
    # ── GPU (NVIDIA) — uncomment to accelerate inference ────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── RAG orchestration API ─────────────────────────────────────────────
  api:
    build: ./api
    container_name: privasearch-api
    environment:
      - SEARXNG_URL=http://searxng:8080   # internal DNS name, internal port
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - RESULT_COUNT=${RESULT_COUNT:-5}         # default # of sources for the AI answer
      - MAX_SOURCES=${MAX_SOURCES:-20}          # hard cap the user can dial up to
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - CHAT_TEMPERATURE=${CHAT_TEMPERATURE:-0.6}  # plain-chat creativity
      # When false, per-source "Summarize" uses the snippet only and makes NO
      # external page fetch (keeps the zero-external-calls guarantee).
      - ALLOW_PAGE_FETCH=${ALLOW_PAGE_FETCH:-true}
      # Max page chars fed to the summarizer (bigger = better but slower on CPU).
      - SUMMARY_MAX_CHARS=${SUMMARY_MAX_CHARS:-4500}
      # How long Ollama keeps the model resident between requests.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Exit-location widget: one cached geo-IP lookup. Set false to disable.
      - SHOW_LOCATION=${SHOW_LOCATION:-true}
      # How SEARCH traffic exits (labels the widget): direct | vpn | tor.
      # Overridden by the vpn/tor compose overrides.
      - EGRESS_MODE=${EGRESS_MODE:-direct}
      - API_PORT=3000
    depends_on: [searxng, ollama]
    networks: [privanet]
    # NO ports published — only nginx (frontend) proxies to it internally.
    restart: unless-stopped

  # ── Static frontend + reverse proxy (the ONLY exposed service) ────────
  frontend:
    build: ./frontend
    container_name: privasearch-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"   # <-- the single exposed port
    depends_on: [api]
    networks: [privanet]
    restart: unless-stopped

networks:
  privanet:
    driver: bridge

volumes:
  ollama-models:
