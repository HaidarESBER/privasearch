# Serves the built React app AND reverse-proxies /api/* to the API container.
# This is what lets us expose ONLY the frontend port: the browser hits this
# nginx, and nginx reaches the API over the internal Docker network.

server {
    listen 80;
    server_name _;
    server_tokens off;                 # don't leak nginx version

    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:3000;    # internal DNS name of the API container
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Server-Sent Events: stream tokens through without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
