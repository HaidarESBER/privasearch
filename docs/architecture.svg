<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>PrivaSearch architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="460" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Architecture</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">One published port. Routine outbound traffic: SearXNG querying upstream engines.</text>

  <rect x="30" y="170" width="120" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="90" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Browser</text>
  <text x="90" y="232" text-anchor="middle" font-size="12" fill="#166534">localhost:8080</text>

  <rect x="185" y="80" width="570" height="350" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="205" y="104" font-size="12" font-weight="700" fill="#475569">Docker network "privanet" (no other ports published)</text>

  <rect x="210" y="170" width="140" height="90" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="280" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">frontend</text>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#1e40af">nginx + React</text>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#1e40af">proxies /api/*</text>

  <rect x="400" y="170" width="140" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="470" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">api</text>
  <text x="470" y="224" text-anchor="middle" font-size="12" fill="#5b21b6">Node + Express</text>
  <text x="470" y="242" text-anchor="middle" font-size="11" fill="#5b21b6">RAG, SSE streaming</text>

  <rect x="585" y="120" width="145" height="80" rx="12" fill="#fef3c7" stroke="#d97706"/>
  <text x="657" y="154" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">searxng</text>
  <text x="657" y="176" text-anchor="middle" font-size="12" fill="#92400e">metasearch, JSON API</text>

  <rect x="585" y="300" width="145" height="80" rx="12" fill="#fce7f3" stroke="#db2777"/>
  <text x="657" y="334" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">ollama</text>
  <text x="657" y="356" text-anchor="middle" font-size="12" fill="#9d174d">local LLM</text>

  <rect x="800" y="130" width="130" height="60" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="865" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Search engines</text>
  <text x="865" y="175" text-anchor="middle" font-size="11" fill="#475569">upstream, public web</text>

  <line x1="150" y1="215" x2="208" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="350" y1="215" x2="398" y2="215" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="200" x2="583" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="232" x2="583" y2="325" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="730" y1="160" x2="798" y2="160" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <text x="575" y="258" font-size="11" fill="#475569">stream answer / chat</text>
  <text x="522" y="140" text-anchor="end" font-size="11" fill="#475569">results (JSON)</text>
  <text x="765" y="214" text-anchor="middle" font-size="11" fill="#92400e">optional: Tor or VPN egress</text>
  <text x="205" y="410" font-size="11" fill="#64748b">The model weights live in the ollama-models volume; SearXNG config is a bind mount (./searxng).</text>
</svg>
