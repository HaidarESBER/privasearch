<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>PrivaSearch search flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Search flow</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#64748b">Results and answer are separate requests, so you can change N and regenerate without re-searching.</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="60" y="80" width="140" height="40" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="130" y="105" fill="#14532d">Browser</text>
    <rect x="300" y="80" width="140" height="40" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="370" y="105" fill="#4c1d95">api</text>
    <rect x="540" y="80" width="140" height="40" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="610" y="105" fill="#78350f">searxng</text>
    <rect x="780" y="80" width="140" height="40" rx="10" fill="#fce7f3" stroke="#db2777"/><text x="850" y="105" fill="#831843">ollama</text>
  </g>
  <g stroke="#cbd5e1" stroke-dasharray="4 4">
    <line x1="130" y1="120" x2="130" y2="420"/><line x1="370" y1="120" x2="370" y2="420"/>
    <line x1="610" y1="120" x2="610" y2="420"/><line x1="850" y1="120" x2="850" y2="420"/>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#a)">
    <line x1="130" y1="160" x2="368" y2="160"/>
    <line x1="370" y1="200" x2="608" y2="200"/>
    <line x1="608" y1="240" x2="372" y2="240"/>
    <line x1="368" y1="280" x2="132" y2="280"/>
    <line x1="130" y1="320" x2="368" y2="320"/>
    <line x1="370" y1="360" x2="848" y2="360"/>
    <line x1="848" y1="395" x2="372" y2="395" stroke-dasharray="5 4"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="250" y="152">1. GET /api/results?q=...</text>
    <text x="490" y="192">search (JSON)</text>
    <text x="490" y="232">results</text>
    <text x="250" y="272">results + hasMore</text>
    <text x="250" y="312">2. POST /api/answer (q, top N sources)</text>
    <text x="610" y="352">build prompt, stream chat</text>
    <text x="610" y="387">tokens</text>
  </g>
  <text x="140" y="418" font-size="11" fill="#475569">Tokens are forwarded to the browser as SSE events (token, error, done).</text>
</svg>
